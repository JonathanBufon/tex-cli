[package]
name = "tex-cli"
version = "0.1.0"
edition = "2021"
description = "cli tool to compile and export tex files to PDF"
license-file = "LICENSE"
repository = "https://github.com/JonathanBufon/tex-cli"

[lib]
name = "tex_cli"
path = "src/lib.rs"

[[bin]]
name = "tex-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
inquire = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
tempfile = "3"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
which = "6"
tera = "1"

[dev-dependencies]
assert_cmd = "2"
assert_fs = "1"
predicates = "3"
