name: Bug report
description: Report a defect in tex-cli
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in
        as much detail as you can — reproducible reports get fixed
        fastest.

        **Security issue?** Do not use this form. See [SECURITY.md](../../SECURITY.md)
        for the private disclosure process.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "`tex-cli build …` exits with code X but I expected …"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: |
        Minimum commands and files needed to reproduce. If you can
        share the template and JSON, please do.
      placeholder: |
        1. `tex-cli init --templates-dir /tmp/tpl --output-dir /tmp/out ...`
        2. `tex-cli templates add my-template.tex`
        3. `tex-cli build my-template data.json`
      render: bash
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior (full output)
      description: |
        Include the full stderr and the exit code
        (`echo "exit: $?"` right after the failing command).
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: tex-cli version
      description: Output of `tex-cli --version`
      placeholder: "tex-cli 0.1.0"
    validations:
      required: true

  - type: input
    id: engine
    attributes:
      label: LaTeX engine
      description: Which engine were you using? (tectonic, latexmk, xelatex, ...)
      placeholder: "tectonic (default)"

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows (WSL2)
        - Docker container
        - Other (please specify in "What happened?")
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I ran the failing command inside the Docker container (or on a supported host) to rule out environment issues.
          required: false
